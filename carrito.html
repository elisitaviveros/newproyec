<!-- CARRITO SLIDE -->
<div id="carrito-slide" class="slide">
  <div style="text-align: left; padding: 20px;">
    <h2>Productos seleccionados</h2>
    <ul id="lista-carrito" style="font-size: 20px;"></ul>
    <h3>Total: $<span id="total-carrito">0.00</span></h3>
    <button class="btn" onclick="vaciarCarrito()">🗑️</button>
    <button class="btn" onclick="cerrarCarrito()">Cerrar</button>
  </div>
</div>

<script>
  let carrito = JSON.parse(localStorage.getItem('carrito')) || [];

  function agregarAlCarrito(nombre, precio) {
  carrito.push({ nombre, precio });
  localStorage.setItem('carrito', JSON.stringify(carrito));
  mostrarCarrito();
  mostrarNotificacion();
}

function mostrarNotificacion() {
  const noti = document.getElementById("notificacion");
  noti.style.display = "block";
  setTimeout(() => {
    noti.style.display = "none";
  }, 2000); // Se oculta en 2 segundos
  }

  function mostrarCarrito() {
    const lista = document.getElementById("lista-carrito");
    const total = document.getElementById("total-carrito");
    lista.innerHTML = "";
    let suma = 0;

    carrito.forEach((item, index) => {
      const li = document.createElement("li");
      li.innerHTML = `
        ${item.nombre} - $${item.precio.toFixed(2)}
        <button style="margin-left: 10px; color:red;" onclick="eliminarProducto(${index})">❌</button>
      `;
      lista.appendChild(li);
      suma += item.precio;
    });

    total.textContent = suma.toFixed(2);
    document.getElementById("carrito-slide").classList.add("active");
  }

  function eliminarProducto(indice) {
    carrito.splice(indice, 1);
    localStorage.setItem('carrito', JSON.stringify(carrito));
    mostrarCarrito();
  }

  function vaciarCarrito() {
    carrito = [];
    localStorage.removeItem('carrito');
    mostrarCarrito();
  }

  function cerrarCarrito() {
    document.getElementById("carrito-slide").classList.remove("active");
  }
</script>
<script>
  // Borra el carrito al cerrar o recargar la página
  window.addEventListener("beforeunload", function () {
    localStorage.removeItem('carrito');
  });
</script>
